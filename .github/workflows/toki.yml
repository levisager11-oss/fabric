# Builds the game on every push to main and puts it on Toki (https://www.playtoki.app).
# No key needed: Toki checks GitHub's signed proof that this run belongs to this repository.
# The steps (install, build, upload) are in Toki's upload script: https://www.playtoki.app/toki-upload.mjs
name: Toki
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: toki
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: curl -fsSL https://www.playtoki.app/toki-upload.mjs -o "$RUNNER_TEMP/toki-upload.mjs"
      - run: node "$RUNNER_TEMP/toki-upload.mjs" --build
