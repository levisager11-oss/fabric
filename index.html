<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07070d">
  <title>Fabric</title>
  <meta name="description" content="An endless pixel-art factory on a dark asteroid field: mine, smelt, assemble, expand and launch.">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="top">
      <button id="goal" class="chip"></button>
      <span class="grow"></span>
      <button id="cores" class="chip" hidden></button>
      <button id="power" class="chip"></button>
      <button id="bMenu" class="chip sq"></button>
    </div>
    <div id="voice" hidden></div>
    <div id="toasts"></div>
    <span class="grow"></span>
    <div id="bottom">
      <div id="sheet" class="panel" hidden></div>
      <div id="tray" class="panel" hidden></div>
      <div id="bar" class="panel"></div>
    </div>
  </div>
  <div id="banner" hidden></div>
  <div id="modal" hidden></div>
  <div id="title"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
